<!doctype html>
<html>
<head><title>GEPS 検索</title></head>
<body>
  <form id="searchForm">
    <label for="query">検索キーワード</label>
    <input id="query" name="query" type="search">
    <label for="startDate">公告日（開始）</label>
    <input id="startDate" name="startDate" type="date">
    <label for="endDate">公告日（終了）</label>
    <input id="endDate" name="endDate" type="date">
    <button id="searchButton" type="submit">検索</button>
  </form>
</body>
</html>
