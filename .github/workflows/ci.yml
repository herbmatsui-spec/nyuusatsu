name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'  # 毎日午前2時に実行

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-mock pytest-xdist pytest-benchmark psutil memory-profiler
    
    - name: Run unit tests
      env:
        PYTHONPATH: .
        REDIS_URL: redis://localhost:6379/0
      run: |
        python -m pytest tests/unit/ -v --no-cov
    
    - name: Run benchmark tests
      env:
        PYTHONPATH: .
        REDIS_URL: redis://localhost:6379/0
      run: |
        python -m pytest tests/unit/test_quality_metrics_benchmarks.py --benchmark-only --benchmark-sort=mean
    
    - name: Run quality metrics specific tests
      env:
        PYTHONPATH: .
        REDIS_URL: redis://localhost:6379/0
      run: |
        python -m pytest tests/unit/test_quality_metrics_service.py -v --no-cov -k "quality_metrics"
    
    - name: Run integration tests (if any)
      env:
        PYTHONPATH: .
        REDIS_URL: redis://localhost:6379/0
      run: |
        python -m pytest tests/integration/ -v --no-cov || true
    
    - name: Type check with mypy
      run: |
        python -m pip install mypy
        python -m mypy services/quality_metrics_service.py --ignore-missing-imports || true
        python -m mypy scripts/collect_quality_metrics.py --ignore-missing-imports || true
        python -m mypy scripts/collect_quality_metrics.py --ignore-missing-imports || true
    
    - name: Code formatting check
      run: |
        python -m pip install black isort
        black --check services/quality_metrics_service.py scripts/collect_quality_metrics.py scripts/evaluate_quality_alerts.py
        isort --check services/quality_metrics_service.py scripts/collect_quality_metrics.py scripts/evaluate_quality_alerts.py
    
    - name: Run mypy type check on quality metrics modules
      run: |
        python -m mypy services/quality_metrics_service.py --ignore-missing-imports --strict --warn-unused-ignores --warn-redundant-casts || true
    
    - name: Validate quality thresholds YAML
      run: |
        python -c "
        import yaml
        with open('config/quality_thresholds.yaml', 'r') as f:
            data = yaml.safe_load(f)
        assert 'metrics' in data, 'metrics section missing'
        for metric, config in data['metrics'].items():
            assert 'warning' in config, f'missing warning for {metric}'
            assert 'critical' in config, f'missing critical for {metric}'
            assert 'lower_is_worse' in config, f'missing lower_is_worse for {metric}'
        print('Quality thresholds YAML is valid')
        "
    
    - name: Run memory profile on quality metrics (smoke test)
      run: |
        python -c "
        import sys
        sys.path.insert(0, '.')
        from services.quality_metrics_service import QualityMetricsService
        from unittest.mock import MagicMock
        session = MagicMock()
        mock_query = MagicMock()
        session.query.return_value = mock_query
        mock_query.count.return_value = 100
        mock_query.filter.return_value = mock_query
        mock_query.with_entities.return_value = mock_query
        mock_query.limit.return_value = mock_query
        mock_query.offset.return_value = mock_query
        mock_query.scalar.return_value = 20.0
        mock_query.order_by.return_value = mock_query
        mock_query.all.return_value = [10.0, 20.0]
        service = QualityMetricsService(mock_session)
        service._bid_query = MagicMock(return_value=mock_query)
        mock_query.filter.return_value = mock_query
        mock_query.count.return_value = 3
        mock_query.order_by.return_value = mock_query
        mock_query.with_entities.return_value = mock_query
        mock_query.limit.return_value = mock_query
        mock_query.offset.return_value = mock_query
        mock_query.scalar.return_value = 20.0
        service.acquisition_delay_median()
        print('Memory profile smoke test passed')
        "
    
    - name: Test parallel metrics collection
      run: |
        python -c "
        import sys
        sys.path.insert(0, '.')
        from services.quality_metrics_service import QualityMetricsService
        from unittest.mock import MagicMock
        session = MagicMock()
        service = QualityMetricsService(session)
        # Mock all sub-methods
        service.missing_field_rate = MagicMock(return_value=5.0)
        service.duplicate_rate = MagicMock(return_value=10.0)
        service.acquisition_delay_median = MagicMock(return_value=30.0)
        service.coverage_rate = MagicMock(return_value=50.0)
        service.coverage_municipality_rate = MagicMock(return_value=60.0)
        service.count_missing_fields = MagicMock(return_value={'organization_name': 50, 'budget': 30})
        service.count_duplicates = MagicMock(return_value=100)
        service.daily_delta = MagicMock(return_value={'new': 100, 'updated': 50})
        service.geps_crawler_success_rate = MagicMock(return_value=95.0)
        service.geps_selector_match_rate = MagicMock(return_value=98.0)
        result = service.collect_all_metrics(parallel=True)
        assert 'missing_field_rate' in result
        assert 'duplicate_rate' in result
        assert len(result) > 10
        print('Parallel metrics collection test passed')
        "
    
    - name: Run linting with ruff
      run: |
        python -m pip install ruff
        ruff check services/quality_metrics_service.py scripts/collect_quality_metrics.py scripts/evaluate_quality_alerts.py || true
    
    - name: Check for security issues with bandit
      run: |
        python -m pip install bandit
        bandit -r services/quality_metrics_service.py scripts/collect_quality_metrics.py -f json -o bandit-report.json || true
        cat bandit-report.json
    
    - name: Validate database schema for quality tables
      run: |
        python -c "
        import sys
        sys.path.insert(0, '.')
        from database.engine import engine
        from database.models.quality_metric import QualityMetric
        from database.models.quality_threshold import QualityThreshold
        from database.models.quality_alert import QualityAlert
        from sqlalchemy import inspect
        inspector = inspect(engine)
        tables = inspector.get_table_names()
        assert 'quality_metric' in tables, 'quality_metric table missing'
        assert 'quality_threshold' in tables, 'quality_threshold table missing'
        assert 'quality_alert' in tables, 'quality_alert table missing'
        print('Quality tables exist in database')
        " || echo "Database not available in CI, skipping schema validation"
    
    - name: Upload coverage
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: htmlcov/